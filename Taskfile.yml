# Snowflake lab path: task bronze:*, task check-tools. Local k8s / kubectl flows removed.

version: "3"

dotenv: [".env"]

includes:
  bronze:
    taskfile: .taskfiles/bronze.yml
  snowflake:
    taskfile: .taskfiles/snowflake.yml
  dt:
    taskfile: .taskfiles/dt.yml

tasks:
  setup:
    desc: Bootstrap — uv sync + create .env from template if missing
    summary: |
      1. Runs `uv sync` to install all Python deps and `uv run …` entrypoints.
      2. Copies `.env.example` → `.env` when `.env` does not already exist.
      Run once after cloning. Fill in `.env`, then `task check-tools`.
    cmds:
      - uv sync
      - |
          if [ ! -f .env ]; then
            cp .env.example .env
            echo "Created .env from .env.example — edit it and fill in your values before running task check-tools."
          else
            echo ".env already exists — skipping copy (edit it if needed)."
          fi

  check-tools:
    desc: Verify lab CLIs on PATH + aws sts get-caller-identity (valid AWS session)
    cmds:
      - uv run check-lab-prereqs

  default:
    desc: List available tasks (start with task check-tools)
    cmds:
      - task --list

  dashboard-local:
    silent: true
    aliases:
      - dashboard
      - streamlit
    desc: (Optional dev) run local Streamlit — lab viz path is SiS; see lab/snowflake-streamlit-sis.md
    cmds:
      - uv run --package=dashboard dashboard

  generator-local:
    silent: true
    desc: run the data generator locally (Python; no cluster)
    aliases:
      - generator
    cmds:
      - uv run --package=generator generator
